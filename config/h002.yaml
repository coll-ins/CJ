# H002 config — FROZEN v0.6 (docs/h002_spec.md section 12 overrides earlier text)
# No grid: every value is single. Sensitivity values are reported, never selected.
hypothesis: H002
spec_version: "0.6"
status: frozen
frozen_at: "v0.6, 2026-11-25T23:13Z, collins (Approve all as proposed)"                      # no historical run / forward recording before collins's freeze approval
implementation:  # spec section 11, decided by collins 26 Nov
  gap_normal_hours: {method: derived_from_data, min_share_of_weeks: 0.5, per_year: true}   # I-1 A
  stop_buffer_spread_hour: reclaim_candle                                                 # I-2 A
  btc_years_rule: {years: [2018, 2023], min_positive: 4}                                  # I-3 B

instruments: [EURUSD, XAUUSD, BTCUSD, GBPUSD, USDJPY, NAS100]   # never pooled
pip_size: {EURUSD: 0.0001, XAUUSD: 0.1, BTCUSD: 1.0, GBPUSD: 0.0001, USDJPY: 0.01, NAS100: 1.0}

data:
  histdata_tz_offset_hours: -5        # fixed EST, no DST; UTC = EST + 5h
  gap_min_consecutive_missing_m1: 5   # inside normal trading hours; overlapping sweep..exit -> event unscorable
  gap_strict_sensitivity: 1           # rerun with any missing minute = gap
  no_path_inference: true
  nas100_source: histdata_NSXUSD      # proxy, NOT identical to Exness US100/USTEC (A-18)
  btc_start: 2017-08-17
time:
  timezone: UTC
  week_start: monday_0000_utc
  month: utc_calendar_month

periods:
  historical_exploratory: {start: 2011-01-01, end: 2023-12-31}
  exposed: {start: 2024-01-01, end: latest}

levels:
  sources_primary: [pw, eq]           # PWH/PWL, EQH/EQL
  sources_descriptive: [pm]           # PMH/PML: recorded and reported, outside the family
  eq:
    pivot_tf: H1
    pivot_k: 3                         # strict > on both sides; confirmed at close of bar i+3
    tolerance_atr: 0.10                # x ATR14(H1) at newest pivot confirmation
    min_pivots: 2
    max_span_trading_days: 5           # A-3
    life_trading_days_after_newest: 5  # A-4
    level_price: most_extreme
  premium_discount:
    neutral_band_frac: 0.05            # of previous week's range, each side of equilibrium
    measured_at: level
    apply_to: [eq, pm]                 # redundant for pw

sweep:
  # Minimum penetration. FX in pips (fixed), others in basis points of the level price.
  p_min:
    EURUSD: {pips: 1.0}
    GBPUSD: {pips: 1.0}
    USDJPY: {pips: 1.0}
    XAUUSD: {bp: 1.5}
    BTCUSD: {bp: 5.0}
    NAS100: {bp: 1.5}
  reclaim_window_minutes: 60           # M5 12 candles, M15 4, H1 1 (same candle only)
  reclaim_strict: true                 # close == level is not a reclaim
  same_candle_allowed: true
  max_penetration_atr: 1.0             # close beyond level + 1 x ATR14(conf TF, prior candle) -> consumed
  attempts_per_level: 1                # first reclaim retires the level; expired window retires it (A-7)
  confirmation_tfs: [M5, M15, H1]
  entry: next_m5_open

risk:
  per_trade_pct: 0.5
  target_r: 3.0
  stop_buffer_atr: 0.10                # x ATR14(conf TF, through reclaim candle) + spread
  stop_buffer_sensitivity: [0.05, 0.20]
  min_stop_cost_multiple: 3.0          # skip if R < 3 x (spread + 2 x slippage)
  max_stop: null
  exit_end_of_week: true
  one_trade_per_instrument_per_cell: true
  same_m1_bar_stop_and_target: stop

costs:
  commission_per_lot: 0                # Exness MT5 Standard
  spread:
    primary_source: exness_public_tick_archive   # ticks.ex2archive.com, docs/exness_data_access.md
    series: {EURUSD: EURUSDm, GBPUSD: GBPUSDm, USDJPY: USDJPYm, XAUUSD: XAUUSDm, BTCUSD: BTCUSDm, NAS100: USTECm}  # m = Standard, INFERRED, pending collins's confirmation
    archive_start: {EURUSD: 2015-08, GBPUSD: 2015-08, USDJPY: 2015-08, XAUUSD: 2015-08, BTCUSD: 2017-09, NAS100: 2019-08}
    aggregation: median_by_hour_of_week_per_calendar_month   # 168 UTC buckets; empty bucket -> month median
    pre_archive: {method: first_12_archived_months_profile, tag: spread_extrapolated}   # option A, collins 26 Nov
    unit_rule: {slope_abs_t_min: 3.0, min_price_range_frac: 0.10, default_if_untestable: bp}
    cost_inputs_manifest: results/h002/cost_inputs.csv   # archive files + SHA-256, committed before first run
    signals_source_unchanged: histdata_binance_bid       # archive used for costs only
    fallback_floor: {EURUSD: 1.0, XAUUSD: 2.5, BTCUSD: 20, GBPUSD: 1.3, USDJPY: 1.2, NAS100: 2.0}  # pips; only if archive unavailable, labelled "unverified cost model"
    sensitivity_multiples: [0.5, 1.0, 1.5, 2.0, 3.0]
    btc_sensitivity: [{usd: 20}, {bp: 2}, {bp: 5}, {bp: 10}]
    pass_bar_multiple: 1.5
    report_break_even: true
  slippage_per_side: {EURUSD: 0.2, XAUUSD: 0.5, BTCUSD: 5, GBPUSD: 0.2, USDJPY: 0.2, NAS100: 0.5}  # pips; ESTIMATES, same as H001
  slippage_sensitivity_multiples: [2.0, 4.0]
  combined_worst_case: {spread_multiple: 2.0, slippage_multiple: 2.0}
  slippage_report_break_even: true
  swap:
    primary: omitted                   # NOT zero-assumed; every table labelled "swap omitted"
    rollover_utc: "22:00"
    triple_weekday: wednesday
    btc_daily_incl_weekends: true
    report_break_even: true
    scenario_s1_adverse_annual_rate:  # ILLUSTRATIVE, never presented as actual swap
      {EURUSD: 0.03, GBPUSD: 0.03, USDJPY: 0.03, XAUUSD: 0.05, NAS100: 0.07, BTCUSD: 0.20}  # illustrative, both directions
    scenario_s2_multiple_of_s1: 2.0
    scenario_s3_exness_spec: pending   # step C
    pass_bar_scenario: s1

stats:
  primary_family_size: 54              # PW unfiltered 3TF x6 = 18; EQ unfiltered+aligned 3TF x6 = 36; 90 if PMH/PML were included
  no_pw_aligned_cell: true             # filter redundant for PWH/PWL (A-21)
  identical_aligned_set_rule: share_result_family_stays_54
  bonferroni_t: 3.31                   # 3.45 for 90
  method: romano_wolf
  familywise_alpha: 0.05
  bootstrap: {type: stationary_block_weeks, mean_block_weeks: 4, draws: 10000, seed: 20261125}
  min_trades: 400
  min_positive_years: {default: 9, of: 13, BTCUSD: 4, BTCUSD_of: 6}   # BTC 2018-2023 (I-3)
  deflated_sharpe_min: 0.95

placebo:
  random_offset: {draws: 200, u_range: [-0.5, 0.5], seed: 20261126}
  stale_week_levels: true
  unequal_pivots: true

event_study_horizons_h1: [1, 4, 12, 24]

v06:   # spec section 12
  weekly_flat: {fx_gold_nas: "Fri 20:00 UTC", btc: "Sun 23:55 UTC", no_entries_until: "Mon 00:00 UTC"}
  gap_normal_hours: {tz: America/New_York, min_share_of_weeks: 0.5, source_year: previous}
  eq_cluster: {tolerance_vs: current_level, chaining: false, sweep_not_member: true, one_cluster_per_pivot: true, sunday_counts_as: monday, expiry: "00:00 UTC after 5th trading day"}
  fills: {touch_fills: true, stop_slippage: true, target_slippage: false, short_stop_trigger: ask, short_target_trigger: ask, ask: "bid + spread(bar month, hour)"}
  same_source_tie: earliest_sweep
  signals_while_open: log_and_retire
  sensitivities_reprice_fixed_trade_list: true
  entry_beyond_stop_or_target: skip_and_log
  atr: {method: wilder, seed: mean_first_14_tr, existing_bars_only: true}
  data_gap_blocks_until_gap_end: true
  unscorable_flag_share: 0.02
  spread_primary: previous_month_bucket_median
  spread_sensitivity_p90: previous_month_bucket_p90
  pre_archive: {method: median_of_first_12_month_bucket_medians, fx_unit: pips, other_unit: bp_of_first_12_month_mean_mid}
  unit_regression: dropped
  slippage_bp: {XAUUSD: 0.14, BTCUSD: 0.56, NAS100: 0.25}   # FX stays 0.2 pip
  btc_signal_source: {exness_BTCUSDm_bid_from: 2017-09-01, binance_proxy_before: true}
  rollover: "17:00 America/New_York, triple Wednesday"
  tests_two_sided: true
  romano_wolf: {studentised: true, centred: true}
  deflated_sharpe: {input: per_trade_R, trials: [54, 13878]}
  placebo_random_offset: {u_range: [0.1, 0.5], outside_range_only: true, independent_draws_per_side: true}
  unequal_pivot_placebo: not_in_cluster_at_confirmation
  stale_levels: descriptive_only
  exposed_period_end: 2026-11-13
  min_trades_all_cells: 400
  year_attribution: entry
  fallback_floor_trigger: archive_month_unavailable_only
