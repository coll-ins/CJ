[project]
name = "cjfx"
version = "0.2.0"
description = "CJ FX research engine: Hypothesis 001 data pipeline, rule engine, backtester and validation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "pyarrow>=14", "scipy>=1.11", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
cjfx = "cjfx.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cjfx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
